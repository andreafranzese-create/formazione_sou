---
- name: provisioning vm
  hosts: all
  become: true
  
  tasks:
    - name: installa curl e ca-certificates
      apt:
        name: [curl, ca-certificates]
        state: present
        update_cache: true
    
    - name: crea una directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    
    - name: url
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0444'

    - name: scrivere un file
      deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: '{{ ansible_distribution_release }}'
        components: stable
        architectures: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
        signed_by: /etc/apt/keyrings/docker.asc   

    - name: installa pacchetti
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: stato servizio
      service:
        name: docker
        state: started

    - name: aggiungi utente vagrant a gruppo docker
      user:
        name: vagrant
        groups: docker
        append: true
      

      

